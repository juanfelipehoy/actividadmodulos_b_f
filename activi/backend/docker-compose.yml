version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrosoft_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-backend_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-backend123}
      POSTGRES_DB: ${DB_DATABASE:-db_agrosoft}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-backend_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: